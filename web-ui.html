<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Health Check - Управление Nginx Upstream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 16px;
            font-size: 28px;
        }

        .api-config {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .api-config input {
            flex: 1;
            min-width: 300px;
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .api-config input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-up {
            background: #d1fae5;
            color: #065f46;
        }

        .status-down {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-unknown {
            background: #e5e7eb;
            color: #374151;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .upstream-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .upstream-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .upstream-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f3f4f6;
        }

        .upstream-name {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
        }

        .upstream-type {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            background: #e0e7ff;
            color: #4338ca;
        }

        .upstream-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-item {
            text-align: center;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        .servers-list {
            margin-top: 16px;
        }

        .server-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 4px solid #e5e7eb;
        }

        .server-item.up {
            border-left-color: #10b981;
        }

        .server-item.down {
            border-left-color: #ef4444;
        }

        .server-info {
            flex: 1;
        }

        .server-address {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .server-details {
            font-size: 12px;
            color: #6b7280;
        }

        .server-actions {
            display: flex;
            gap: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f3f4f6;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: #f3f4f6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #f3f4f6;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #3b82f6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .refresh-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 12px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auto-refresh-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: #cbd5e1;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: #667eea;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        .config-section {
            margin-bottom: 24px;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .config-section-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #374151;
        }

        .config-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .api-config {
                flex-direction: column;
            }

            .api-config input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Dynamic Health Check Manager</h1>
            <div class="api-config">
                <input type="text" id="apiBaseUrl" placeholder="Базовый URL API (например: http://localhost:8888)" value="">
                <button class="btn btn-primary" onclick="loadUpstreams()">Обновить</button>
            </div>
            <div class="auto-refresh-toggle">
                <span>Автообновление:</span>
                <div class="toggle-switch" id="autoRefreshToggle" onclick="toggleAutoRefresh()"></div>
                <span id="refreshStatus">Выкл</span>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Загрузка данных...</div>
        </div>

        <div id="error" class="alert alert-error" style="display: none;"></div>

        <div id="dashboard" class="dashboard" style="display: none;"></div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📭</div>
            <h2>Нет настроенных upstream блоков</h2>
            <p>Настройте upstream блоки с директивой <code>check</code> в конфигурации Nginx</p>
        </div>
    </div>

    <!-- Модальное окно для добавления/редактирования сервера -->
    <div id="serverModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="serverModalTitle">Добавить сервер</h2>
                <button class="close-btn" onclick="closeServerModal()">&times;</button>
            </div>
            <div id="serverModalAlert"></div>
            <form id="serverForm" onsubmit="saveServer(event)">
                <input type="hidden" id="serverAction" value="add">
                <input type="hidden" id="serverUpstream" value="">
                <input type="hidden" id="serverAddressOld" value="">

                <div class="form-group">
                    <label class="form-label">Upstream</label>
                    <input type="text" class="form-input" id="serverUpstreamDisplay" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">Адрес сервера (host:port) *</label>
                    <input type="text" class="form-input" id="serverAddress" placeholder="192.168.1.100:443" required>
                </div>

                <div class="config-row">
                    <div class="form-group">
                        <label class="form-label">Вес</label>
                        <input type="number" class="form-input" id="serverWeight" placeholder="1" min="1">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Max Fails</label>
                        <input type="number" class="form-input" id="serverMaxFails" placeholder="1" min="1">
                    </div>
                </div>

                <div class="config-row">
                    <div class="form-group">
                        <label class="form-label">Fail Timeout (мс)</label>
                        <input type="number" class="form-input" id="serverFailTimeout" placeholder="10000" min="0">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Max Conns</label>
                        <input type="number" class="form-input" id="serverMaxConns" placeholder="0" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="serverBackup"> Резервный сервер
                    </label>
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="serverDown"> Сервер недоступен
                    </label>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeServerModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно для редактирования конфигурации healthcheck -->
    <div id="configModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Настройки Health Check</h2>
                <button class="close-btn" onclick="closeConfigModal()">&times;</button>
            </div>
            <div id="configModalAlert"></div>
            <form id="configForm" onsubmit="saveConfig(event)">
                <input type="hidden" id="configUpstream" value="">

                <div class="config-section">
                    <div class="config-section-title">Основные параметры</div>
                    <div class="config-row">
                        <div class="form-group">
                            <label class="form-label">Тип проверки</label>
                            <select class="form-select" id="configType" required>
                                <option value="http">HTTP</option>
                                <option value="https">HTTPS</option>
                                <option value="tcp">TCP</option>
                                <option value="ssl">SSL</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Fall</label>
                            <input type="number" class="form-input" id="configFall" placeholder="2" min="1" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Rise</label>
                            <input type="number" class="form-input" id="configRise" placeholder="2" min="1" required>
                        </div>
                    </div>

                    <div class="config-row">
                        <div class="form-group">
                            <label class="form-label">Interval (сек)</label>
                            <input type="number" class="form-input" id="configInterval" placeholder="10" min="1" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Timeout (мс)</label>
                            <input type="number" class="form-input" id="configTimeout" placeholder="10000" min="1" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Keepalive</label>
                            <input type="number" class="form-input" id="configKeepalive" placeholder="1" min="1">
                        </div>
                    </div>
                </div>

                <div class="config-section">
                    <div class="config-section-title">HTTP/HTTPS параметры</div>
                    <div class="form-group">
                        <label class="form-label">Request URI</label>
                        <input type="text" class="form-input" id="configRequestUri" placeholder="GET /health">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Request Headers</label>
                        <input type="text" class="form-input" id="configRequestHeaders" placeholder="Host:example.com Authorization:Basic token">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Response Codes</label>
                        <input type="text" class="form-input" id="configResponseCodes" placeholder="200 201 204">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Response Body (regexp)</label>
                        <input type="text" class="form-input" id="configResponseBody" placeholder=".*healthy.*">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeConfigModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let apiBaseUrl = '';
        let autoRefreshInterval = null;
        let autoRefreshEnabled = false;

        // Определение базового URL API
        function detectApiBaseUrl() {
            const currentUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '');
            const input = document.getElementById('apiBaseUrl');
            if (!input.value) {
                input.value = currentUrl;
            }
            apiBaseUrl = input.value || currentUrl;
        }

        // Загрузка списка upstream
        async function loadUpstreams() {
            detectApiBaseUrl();
            
            const loading = document.getElementById('loading');
            const dashboard = document.getElementById('dashboard');
            const error = document.getElementById('error');
            const emptyState = document.getElementById('emptyState');

            loading.style.display = 'block';
            dashboard.style.display = 'none';
            error.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                // Получаем список всех upstream через status endpoint
                const statusResponse = await fetch(`${apiBaseUrl}/healthcheck/status`);
                if (!statusResponse.ok) {
                    throw new Error(`HTTP ${statusResponse.status}: ${statusResponse.statusText}`);
                }

                const statusText = await statusResponse.text();
                const upstreams = parseStatusResponse(statusText);

                if (upstreams.length === 0) {
                    emptyState.style.display = 'block';
                    loading.style.display = 'none';
                    return;
                }

                // Загружаем детальную информацию для каждого upstream
                const upstreamsData = await Promise.all(
                    upstreams.map(async (name) => {
                        try {
                            const [config, servers] = await Promise.all([
                                fetchConfig(name),
                                fetchServers(name)
                            ]);
                            return { name, config, servers };
                        } catch (e) {
                            console.error(`Ошибка загрузки ${name}:`, e);
                            return { name, config: null, servers: [] };
                        }
                    })
                );

                renderDashboard(upstreamsData);
                loading.style.display = 'none';
                dashboard.style.display = 'grid';
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                error.textContent = `Ошибка: ${err.message}. Проверьте URL API и убедитесь, что endpoints доступны.`;
                error.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        // Парсинг ответа status endpoint
        function parseStatusResponse(text) {
            const lines = text.split('\n').filter(line => line.trim());
            const upstreams = new Set();
            
            lines.forEach(line => {
                // Формат: upstream_name:server_address status
                const match = line.match(/^([^:]+):/);
                if (match) {
                    upstreams.add(match[1]);
                }
            });

            return Array.from(upstreams);
        }

        // Загрузка конфигурации upstream
        async function fetchConfig(upstream) {
            try {
                const response = await fetch(`${apiBaseUrl}/healthcheck/get?upstream=${encodeURIComponent(upstream)}`);
                if (!response.ok) return null;
                
                const text = await response.text();
                return parseConfigResponse(text);
            } catch (e) {
                console.error(`Ошибка загрузки конфигурации для ${upstream}:`, e);
                return null;
            }
        }

        // Парсинг конфигурации
        function parseConfigResponse(text) {
            const config = {};
            const lines = text.split('\n').filter(line => line.trim());
            
            lines.forEach(line => {
                const [key, ...valueParts] = line.split(':');
                if (key && valueParts.length > 0) {
                    config[key.trim()] = valueParts.join(':').trim();
                }
            });

            return config;
        }

        // Загрузка списка серверов
        async function fetchServers(upstream) {
            try {
                const response = await fetch(`${apiBaseUrl}/dynamic_upstream?upstream=${encodeURIComponent(upstream)}`);
                if (!response.ok) return [];
                
                const text = await response.text();
                return parseServersResponse(text);
            } catch (e) {
                console.error(`Ошибка загрузки серверов для ${upstream}:`, e);
                return [];
            }
        }

        // Парсинг списка серверов
        function parseServersResponse(text) {
            const servers = [];
            const lines = text.split('\n').filter(line => line.trim());
            
            lines.forEach(line => {
                const match = line.match(/server\s+([^\s]+)(.*);/);
                if (match) {
                    const address = match[1];
                    const params = match[2] || '';
                    const server = { address };
                    
                    // Парсинг параметров
                    if (params.includes('weight=')) {
                        const wMatch = params.match(/weight=(\d+)/);
                        if (wMatch) server.weight = parseInt(wMatch[1]);
                    }
                    if (params.includes('max_fails=')) {
                        const mfMatch = params.match(/max_fails=(\d+)/);
                        if (mfMatch) server.max_fails = parseInt(mfMatch[1]);
                    }
                    if (params.includes('fail_timeout=')) {
                        const ftMatch = params.match(/fail_timeout=(\d+)/);
                        if (ftMatch) server.fail_timeout = parseInt(ftMatch[1]);
                    }
                    if (params.includes('max_conns=')) {
                        const mcMatch = params.match(/max_conns=(\d+)/);
                        if (mcMatch) server.max_conns = parseInt(mcMatch[1]);
                    }
                    server.backup = params.includes('backup');
                    server.down = params.includes('down');
                    
                    servers.push(server);
                }
            });

            return servers;
        }

        // Загрузка статуса серверов
        async function fetchStatus(upstream) {
            try {
                const response = await fetch(`${apiBaseUrl}/healthcheck/status?upstream=${encodeURIComponent(upstream)}`);
                if (!response.ok) return {};
                
                const text = await response.text();
                return parseStatus(text);
            } catch (e) {
                console.error(`Ошибка загрузки статуса для ${upstream}:`, e);
                return {};
            }
        }

        // Парсинг статуса
        function parseStatus(text) {
            const status = {};
            const lines = text.split('\n').filter(line => line.trim());
            
            lines.forEach(line => {
                const match = line.match(/^([^\s]+)\s+(up|down)\s+fall=(\d+)\s+rise=(\d+)/);
                if (match) {
                    status[match[1]] = {
                        status: match[2],
                        fall: parseInt(match[3]),
                        rise: parseInt(match[4])
                    };
                }
            });

            return status;
        }

        // Отрисовка дашборда
        async function renderDashboard(upstreamsData) {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';

            for (const upstream of upstreamsData) {
                const status = await fetchStatus(upstream.name);
                const card = createUpstreamCard(upstream, status);
                dashboard.appendChild(card);
            }
        }

        // Создание карточки upstream
        function createUpstreamCard(upstream, status) {
            const card = document.createElement('div');
            card.className = 'upstream-card';

            const type = upstream.config?.type || 'unknown';
            const typeColors = {
                'http': '#3b82f6',
                'https': '#10b981',
                'tcp': '#f59e0b',
                'ssl': '#8b5cf6'
            };

            const upCount = Object.values(status).filter(s => s.status === 'up').length;
            const downCount = Object.values(status).filter(s => s.status === 'down').length;
            const totalCount = upstream.servers.length;

            card.innerHTML = `
                <div class="upstream-header">
                    <div>
                        <div class="upstream-name">${escapeHtml(upstream.name)}</div>
                        <span class="upstream-type" style="background: ${typeColors[type] || '#6b7280'}20; color: ${typeColors[type] || '#6b7280'}">
                            ${type.toUpperCase()}
                        </span>
                    </div>
                    <button class="btn btn-primary btn-small" onclick="openConfigModal('${escapeHtml(upstream.name)}')">
                        ⚙️ Настройки
                    </button>
                </div>

                <div class="upstream-stats">
                    <div class="stat-item">
                        <div class="stat-value">${totalCount}</div>
                        <div class="stat-label">Всего серверов</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" style="color: #10b981">${upCount}</div>
                        <div class="stat-label">Доступно</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" style="color: #ef4444">${downCount}</div>
                        <div class="stat-label">Недоступно</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${upstream.config?.interval || 'N/A'}</div>
                        <div class="stat-label">Interval (сек)</div>
                    </div>
                </div>

                <div class="servers-list">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <strong>Серверы</strong>
                        <button class="btn btn-success btn-small" onclick="openServerModal('${escapeHtml(upstream.name)}', 'add')">
                            + Добавить
                        </button>
                    </div>
                    ${upstream.servers.length > 0 
                        ? upstream.servers.map(server => createServerItem(server, status[server.address], upstream.name)).join('')
                        : '<div style="text-align: center; padding: 20px; color: #6b7280;">Нет серверов</div>'
                    }
                </div>
            `;

            return card;
        }

        // Создание элемента сервера
        function createServerItem(server, serverStatus, upstreamName) {
            const status = serverStatus?.status || 'unknown';
            const statusClass = status === 'up' ? 'up' : status === 'down' ? 'down' : '';
            const statusText = status === 'up' ? 'Доступен' : status === 'down' ? 'Недоступен' : 'Неизвестно';
            const fall = serverStatus?.fall || 0;
            const rise = serverStatus?.rise || 0;

            return `
                <div class="server-item ${statusClass}">
                    <div class="server-info">
                        <div class="server-address">${escapeHtml(server.address)}</div>
                        <div class="server-details">
                            <span class="status-badge status-${status}">${statusText}</span>
                            ${server.weight ? `<span>Weight: ${server.weight}</span>` : ''}
                            ${server.max_fails ? `<span>Max Fails: ${server.max_fails}</span>` : ''}
                            ${fall > 0 || rise > 0 ? `<span>Fall: ${fall}, Rise: ${rise}</span>` : ''}
                            ${server.backup ? '<span style="color: #f59e0b;">Backup</span>' : ''}
                            ${server.down ? '<span style="color: #ef4444;">Down</span>' : ''}
                        </div>
                    </div>
                    <div class="server-actions">
                        <button class="btn btn-primary btn-small" onclick="openServerModalEdit('${escapeHtml(upstreamName)}', '${escapeHtml(server.address)}', ${server.weight || 0}, ${server.max_fails || 0}, ${server.fail_timeout || 0}, ${server.max_conns || 0}, ${server.backup ? 'true' : 'false'}, ${server.down ? 'true' : 'false'})">
                            ✏️
                        </button>
                        <button class="btn btn-danger btn-small" onclick="deleteServer('${escapeHtml(upstreamName)}', '${escapeHtml(server.address)}')">
                            🗑️
                        </button>
                    </div>
                </div>
            `;
        }

        // Открытие модального окна для сервера
        function openServerModal(upstream, action, address = '', serverData = null) {
            document.getElementById('serverAction').value = action;
            document.getElementById('serverUpstream').value = upstream;
            document.getElementById('serverUpstreamDisplay').value = upstream;
            document.getElementById('serverAddressOld').value = address;
            document.getElementById('serverModalTitle').textContent = action === 'add' ? 'Добавить сервер' : 'Редактировать сервер';
            
            if (action === 'update' && serverData) {
                // Заполняем форму данными сервера
                document.getElementById('serverAddress').value = address;
                document.getElementById('serverWeight').value = serverData.weight || '';
                document.getElementById('serverMaxFails').value = serverData.max_fails || '';
                document.getElementById('serverFailTimeout').value = serverData.fail_timeout || '';
                document.getElementById('serverMaxConns').value = serverData.max_conns || '';
                document.getElementById('serverBackup').checked = serverData.backup || false;
                document.getElementById('serverDown').checked = serverData.down || false;
            } else {
                // Очищаем форму для добавления нового сервера
                document.getElementById('serverForm').reset();
                document.getElementById('serverAction').value = action;
                document.getElementById('serverUpstream').value = upstream;
                document.getElementById('serverUpstreamDisplay').value = upstream;
            }

            document.getElementById('serverModal').classList.add('active');
        }

        // Упрощенная функция для редактирования сервера
        function openServerModalEdit(upstream, address, weight, maxFails, failTimeout, maxConns, backup, down) {
            openServerModal(upstream, 'update', address, {
                weight: weight || undefined,
                max_fails: maxFails || undefined,
                fail_timeout: failTimeout || undefined,
                max_conns: maxConns || undefined,
                backup: backup === 'true',
                down: down === 'true'
            });
        }

        // Закрытие модального окна сервера
        function closeServerModal() {
            document.getElementById('serverModal').classList.remove('active');
            document.getElementById('serverModalAlert').innerHTML = '';
        }

        // Сохранение сервера
        async function saveServer(event) {
            event.preventDefault();
            
            const action = document.getElementById('serverAction').value;
            const upstream = document.getElementById('serverUpstream').value;
            const address = document.getElementById('serverAddress').value;
            const oldAddress = document.getElementById('serverAddressOld').value;
            const alertDiv = document.getElementById('serverModalAlert');

            const data = {
                upstream: upstream,
                action: action,
                server: address,
                weight: parseInt(document.getElementById('serverWeight').value) || undefined,
                max_fails: parseInt(document.getElementById('serverMaxFails').value) || undefined,
                fail_timeout: parseInt(document.getElementById('serverFailTimeout').value) || undefined,
                max_conns: parseInt(document.getElementById('serverMaxConns').value) || undefined,
                backup: document.getElementById('serverBackup').checked,
                down: document.getElementById('serverDown').checked
            };

            // Для update используем старый адрес как идентификатор
            if (action === 'update' && oldAddress) {
                // Если адрес изменился, нужно сначала удалить старый и добавить новый
                // Но для простоты оставим обновление по старому адресу
                data.server = oldAddress;
            }

            try {
                const method = action === 'add' ? 'POST' : action === 'remove' ? 'DELETE' : 'PUT';
                const response = await fetch(`${apiBaseUrl}/dynamic_upstream`, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    alertDiv.innerHTML = '<div class="alert alert-success">Сервер успешно сохранен!</div>';
                    setTimeout(() => {
                        closeServerModal();
                        loadUpstreams();
                    }, 1000);
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-error">Ошибка: ${result.error || 'Неизвестная ошибка'}</div>`;
                }
            } catch (err) {
                alertDiv.innerHTML = `<div class="alert alert-error">Ошибка: ${err.message}</div>`;
            }
        }

        // Удаление сервера
        async function deleteServer(upstream, address) {
            if (!confirm(`Удалить сервер ${address} из upstream ${upstream}?`)) {
                return;
            }

            try {
                const response = await fetch(`${apiBaseUrl}/dynamic_upstream`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        upstream: upstream,
                        action: 'remove',
                        server: address
                    })
                });

                if (response.ok) {
                    loadUpstreams();
                } else {
                    alert('Ошибка при удалении сервера');
                }
            } catch (err) {
                alert(`Ошибка: ${err.message}`);
            }
        }

        // Открытие модального окна конфигурации
        async function openConfigModal(upstream) {
            document.getElementById('configUpstream').value = upstream;
            const alertDiv = document.getElementById('configModalAlert');
            alertDiv.innerHTML = '';

            try {
                const config = await fetchConfig(upstream);
                if (config) {
                    document.getElementById('configType').value = config.type || 'http';
                    document.getElementById('configFall').value = config.fall || '2';
                    document.getElementById('configRise').value = config.rise || '2';
                    document.getElementById('configInterval').value = config.interval || '10';
                    document.getElementById('configTimeout').value = config.timeout || '10000';
                    document.getElementById('configKeepalive').value = config.keepalive || '1';
                    document.getElementById('configRequestUri').value = config.request_uri || '';
                    document.getElementById('configRequestHeaders').value = config.request_headers || '';
                    document.getElementById('configResponseCodes').value = config.response_codes || '';
                    document.getElementById('configResponseBody').value = config.response_body || '';
                }
            } catch (err) {
                alertDiv.innerHTML = `<div class="alert alert-error">Ошибка загрузки конфигурации: ${err.message}</div>`;
            }

            document.getElementById('configModal').classList.add('active');
        }

        // Закрытие модального окна конфигурации
        function closeConfigModal() {
            document.getElementById('configModal').classList.remove('active');
            document.getElementById('configModalAlert').innerHTML = '';
        }

        // Сохранение конфигурации
        async function saveConfig(event) {
            event.preventDefault();
            
            const upstream = document.getElementById('configUpstream').value;
            const alertDiv = document.getElementById('configModalAlert');

            const params = new URLSearchParams({
                upstream: upstream,
                type: document.getElementById('configType').value,
                fall: document.getElementById('configFall').value,
                rise: document.getElementById('configRise').value,
                interval: document.getElementById('configInterval').value,
                timeout: document.getElementById('configTimeout').value,
                keepalive: document.getElementById('configKeepalive').value
            });

            const requestUri = document.getElementById('configRequestUri').value;
            const requestHeaders = document.getElementById('configRequestHeaders').value;
            const responseCodes = document.getElementById('configResponseCodes').value;
            const responseBody = document.getElementById('configResponseBody').value;

            if (requestUri) params.append('request_uri', requestUri);
            if (requestHeaders) params.append('request_headers', requestHeaders);
            if (responseCodes) params.append('response_codes', responseCodes);
            if (responseBody) params.append('response_body', responseBody);

            try {
                const response = await fetch(`${apiBaseUrl}/healthcheck/update?${params.toString()}`);
                const result = await response.text();

                if (response.ok) {
                    alertDiv.innerHTML = '<div class="alert alert-success">Конфигурация успешно сохранена!</div>';
                    setTimeout(() => {
                        closeConfigModal();
                        loadUpstreams();
                    }, 1000);
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-error">Ошибка: ${result}</div>`;
                }
            } catch (err) {
                alertDiv.innerHTML = `<div class="alert alert-error">Ошибка: ${err.message}</div>`;
            }
        }

        // Переключение автообновления
        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            const toggle = document.getElementById('autoRefreshToggle');
            const status = document.getElementById('refreshStatus');

            if (autoRefreshEnabled) {
                toggle.classList.add('active');
                status.textContent = 'Вкл (30 сек)';
                autoRefreshInterval = setInterval(loadUpstreams, 30000);
            } else {
                toggle.classList.remove('active');
                status.textContent = 'Выкл';
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }

        // Экранирование HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Инициализация при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            detectApiBaseUrl();
            loadUpstreams();
        });

        // Обработка Enter в поле API URL
        document.getElementById('apiBaseUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadUpstreams();
            }
        });
    </script>
</body>
</html>
